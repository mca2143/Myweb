<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Village Word Files</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background:
    linear-gradient(#0003, #0005),
    url("https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=2000&q=90")
    center center / cover fixed no-repeat;
  color: #fff;
}

header {
  text-align: center;
  padding: 24px 12px;
  background: #123b28aa;
}

header h1 {
  margin: 0 0 8px;
  font-size: 30px;
}

header p {
  margin: 0;
}

.container {
  width: min(1000px, 94%);
  margin: 30px auto;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 20px;
}

.box {
  align-self: start;
  background: #ffffffeb;
  color: #173c29;
  border-radius: 14px;
  padding: 18px;
  box-shadow: 0 6px 20px #0005;
}

.box h2 {
  margin: 0;
}

.box-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}

.box-heading button,
.action {
  border: 0;
  border-radius: 6px;
  padding: 9px 12px;
  color: white;
  cursor: pointer;
}

.box-heading button {
  background: #17653c;
}

.file-list {
  display: none;
  margin-top: 14px;
}

.file-list.show {
  display: block;
}

.file {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 0;
  border-top: 1px solid #ddd;
}

.file-name {
  flex: 1;
  overflow-wrap: anywhere;
}

.open-btn {
  background: #1769aa;
}

.copy-btn {
  background: #178348;
}

#viewer {
  display: none;
  width: min(900px, 94%);
  margin: 25px auto 40px;
  background: #fff;
  color: #222;
  padding: 22px;
  border-radius: 14px;
  box-shadow: 0 6px 25px #0006;
}

#viewer h2 {
  overflow-wrap: anywhere;
}

#documentText {
  width: 100%;
  min-height: 280px;
  padding: 15px;
  border: 1px solid #bbb;
  border-radius: 8px;
  font: 16px/1.7 Arial, sans-serif;
  resize: vertical;
  white-space: pre-wrap;
}

.viewer-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 12px;
}

.close-btn {
  background: #b42318;
}

@media (max-width: 650px) {
  .container {
    grid-template-columns: 1fr;
    margin-top: 18px;
  }

  header h1 {
    font-size: 24px;
  }
}
</style>
</head>

<body>

<header>
  <h1>🌿 My Village Documents</h1>
  <p>Click a box to view your files</p>
</header>

<main class="container" id="boxes"></main>

<section id="viewer">
  <h2 id="documentTitle">My Document</h2>

  <textarea id="documentText"
    placeholder="Your complete document text appears here..."></textarea>

  <div class="viewer-actions">
    <button class="action copy-btn" onclick="copyCurrent()">
      📋 Copy Full Text
    </button>

    <button class="action close-btn" onclick="closeDocument()">
      ✖ Close Document
    </button>
  </div>
</section>

<script>
/*
  Replace the sample text below with your own full text.
  Each item represents one document.
*/

const files = Array.from({ length: 40 }, (_, i) => ({
  id: i + 1,
  box: Math.floor(i / 10) + 1,
  name: `Word File ${String(i + 1).padStart(2, "0")}`,
  content:
    `WORD FILE ${i + 1}\n\n` +
    `Paste the complete text for your document here.\n\n` +
    `You can replace this sample content with your own text.`
}));

let currentFile = null;

function createBoxes() {
  const container = document.getElementById("boxes");

  for (let number = 1; number <= 4; number++) {
    const box = document.createElement("section");
    box.className = "box";

    const heading = document.createElement("div");
    heading.className = "box-heading";

    const title = document.createElement("h2");
    title.textContent = `📁 Box ${number}`;

    const toggle = document.createElement("button");
    toggle.textContent = "Open ▼";
    toggle.setAttribute("aria-expanded", "false");

    const list = document.createElement("div");
    list.className = "file-list";

    toggle.addEventListener("click", () => {
      const opening = !list.classList.contains("show");
      list.classList.toggle("show", opening);
      toggle.textContent = opening ? "Close ▲" : "Open ▼";
      toggle.setAttribute("aria-expanded", String(opening));
    });

    heading.append(title, toggle);
    box.append(heading, list);

    files.filter(file => file.box === number).forEach(file => {
      const row = document.createElement("div");
      row.className = "file";

      const name = document.createElement("span");
      name.className = "file-name";
      name.textContent = "📄 " + file.name;

      const openButton = document.createElement("button");
      openButton.className = "action open-btn";
      openButton.textContent = "Open";
      openButton.addEventListener("click", () => openDocument(file));

      row.append(name, openButton);
      list.appendChild(row);
    });

    container.appendChild(box);
  }
}

function openDocument(file) {
  currentFile = file;
  document.getElementById("documentTitle").textContent = file.name;
  document.getElementById("documentText").value = file.content;

  const viewer = document.getElementById("viewer");
  viewer.style.display = "block";
  viewer.scrollIntoView({ behavior: "smooth", block: "start" });
}

async function copyCurrent() {
  if (!currentFile) return;

  const text = document.getElementById("documentText").value;

  try {
    await navigator.clipboard.writeText(text);
    alert("Full document text copied!");
  } catch (error) {
    const area = document.getElementById("documentText");
    area.focus();
    area.select();

    const success = document.execCommand("copy");

    alert(success
      ? "Full document text copied!"
      : "Please select the text and copy it manually.");
  }
}

function closeDocument() {
  document.getElementById("viewer").style.display = "none";
  currentFile = null;
}

createBoxes();
</script>

</body>
</html>
